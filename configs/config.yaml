# configs/config.yaml
# ─────────────────────────────────────────────
# Central configuration for the EUR/USD predictor project.
# ─────────────────────────────────────────────

# ── Data ──────────────────────────────────────
data:
  ticker: "EURUSD=X"
  timeframe: "1h"

  # yfinance limits 1h data to the last 730 days — start_date will be
  # automatically clamped to that window by fetch_data.py.
  # Set to null to always fetch the maximum available history.
  start_date: null
  end_date: null

  raw_path: "data/fetch/raw_eurusd.parquet"
  processed_path: "data/fetch/processed_eurusd.parquet"

  # ── Label thresholds ──────────────────────────────────────────────────────
  # These are per-BAR log-return thresholds (not daily).
  # For 1h EUR/USD:
  #   Typical hourly move: ~0.02–0.05%
  #   Use the 25th/75th percentile of |returns| as weak/strong thresholds.
  #   Run fetch_data.py and check the describe() output, then tune these.
  #
  # Suggested starting point for 1h EUR/USD:
  strong_threshold: 0.00082   # ~0.08% per hour  → Strong Buy/Sell
  weak_threshold:   0.00022   # ~0.02% per hour  → Buy/Sell
  #
  # If you still get >60% Hold labels, lower both values.
  # If you get <10% Hold, raise both values.

  train_ratio: 0.70
  val_ratio:   0.15

# ── Features ──────────────────────────────────
features:
  # All window sizes below are expressed in TRADING DAYS.
  # feature_engineering.py multiplies them by bars_per_day for the
  # actual timeframe, so these values mean the same thing at 1h or 1d.
  #
  # Example: sma_window=20 on 1h → 20 * 6 = 120 bars (≈ 20 trading days)
  #          sma_window=20 on 1d → 20 * 1 = 20 bars  (≈ 20 trading days)

  sma_windows:    [5, 10, 20, 50, 100, 200]  # in trading days
  ema_windows:    [5, 12, 26, 50]             # in trading days
  rsi_period:     14    # in trading days
  atr_period:     14    # in trading days
  bb_period:      20    # in trading days
  bb_std:         2
  macd_fast:      12    # in trading days
  macd_slow:      26    # in trading days
  macd_signal:    9     # in trading days
  stoch_period:   14    # in trading days
  cci_period:     20    # in trading days
  williams_period: 14   # in trading days

  # Lag features in trading-day equivalents
  # [1d, 2d, 3d, 1w, 2w, 1mo] → scaled to bar count by feature_engineering.py
  lag_periods:    [1, 2, 3, 5, 10, 21]

  # Rolling stat windows in trading-day equivalents
  rolling_windows: [5, 10, 21]

  # Sequence length for LSTM/Transformer — in bars (not days).
  # 48 bars = 48 hours = ~8 trading days of hourly context.
  # Increase to 72 or 96 if GPU memory allows.
  sequence_length: 48

  featured_path: "data/features"

# ── MLflow / S3 ───────────────────────────────
mlflow:
  location: dagshub   # local | dagshub | aws
  repo_owner: "AgabaEmbedded"
  repo_name: "Price-Prediction-End-to-End"
  s3_artifact_uri: ""
  tracking_uri: "https://dagshub.com/AgabaEmbedded/Price-Prediction-End-to-End.mlflow"
  local_db_path: "mlflow.db"
  experiment_name: "Price_prediction"

# ── Model Search ──────────────────────────────
model_search:
  cv_folds: 5
  scoring: "f1_macro"
  n_jobs: -1
  include_deep_learning: true

# ── Hyperparameter Tuning ─────────────────────
hpo:
  framework: "optuna"
  n_trials: 50
  timeout: 3600
  cv_folds: 5
  scoring: "f1_macro"
  direction: "maximize"

# ── Training ──────────────────────────────────
training:
  random_seed: 42
  dl:
    batch_size: 64
    max_epochs: 100
    learning_rate: 0.001
    patience: 10
    device: "auto"

# ── Output ────────────────────────────────────
output:
  model_dir: "saved_models/"
  plots_dir: "plots/"

trade:
  size: 0.01
  IC_MT5_PATH: "C:/Program Files/MetaTrader 5/terminal64.exe"
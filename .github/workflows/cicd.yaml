# This workflow will build and push a new container image to Amazon ECR,
# and then will deploy a new task definition to Amazon ECS, when there is a push to the "main" branch.
#
# To use this workflow, you will need to complete the following set-up steps:
#
# 1. Create an ECR repository to store your images.
#    For example: `aws ecr create-repository --repository-name my-ecr-repo --region us-east-2`.
#    Replace the value of the `ECR_REPOSITORY` environment variable in the workflow below with your repository's name.
#    Replace the value of the `AWS_REGION` environment variable in the workflow below with your repository's region.
#
# 2. Create an ECS task definition, an ECS cluster, and an ECS service.
#    For example, follow the Getting Started guide on the ECS console:
#      https://us-east-2.console.aws.amazon.com/ecs/home?region=us-east-2#/firstRun
#    Replace the value of the `ECS_SERVICE` environment variable in the workflow below with the name you set for the Amazon ECS service.
#    Replace the value of the `ECS_CLUSTER` environment variable in the workflow below with the name you set for the cluster.
#
# 3. Store your ECS task definition as a JSON file in your repository.
#    The format should follow the output of `aws ecs register-task-definition --generate-cli-skeleton`.
#    Replace the value of the `ECS_TASK_DEFINITION` environment variable in the workflow below with the path to the JSON file.
#    Replace the value of the `CONTAINER_NAME` environment variable in the workflow below with the name of the container
#    in the `containerDefinitions` section of the task definition.
#
# 4. Store an IAM user access key in GitHub Actions secrets named `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`.
#    See the documentation for each action used below for the recommended IAM policies for this IAM user,
#    and best practices on handling the access key credentials.

name: Deploy to Amazon EC2

on:
  #push:
  #  branches: [ "main" ]
  schedule:
    # 00:00 UTC
    - cron: '0 0 0 0 0' #* * * * *'

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: ml-cicd
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ubuntu
  CONTAINER_NAME: wine-detection-container

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        run: echo "Running ML integration tests..."

  push-to-ecr:
    name: Build and Push to ECR
    needs: integration
    runs-on: ubuntu-latest
    # We define outputs here so the next job can see the image name
    outputs:
      full_image: ${{ steps.build-image.outputs.full_image }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "full_image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-to-ec2:
    name: Deploy to EC2
    needs: push-to-ecr
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Only pass the variables needed for the logic
          envs: IMAGE_NAME, REGISTRY, REGION
          script: |
            # 1. Navigate to the folder where your compose.yaml is
            cd /home/ubuntu
            
            # 2. Login using the EC2's IAM Role (No keys needed!)
            aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY
            
            # 3. Stop and remove the OLD container (using its name)
            # Make sure this name matches the 'container_name' in your compose.yaml
            docker stop ubuntu-price-app-1 || true
            docker rm ubuntu-price-app-1 || true
            
            # 4. Pull and launch
            export IMAGE_NAME=$IMAGE_NAME
            docker pull $IMAGE_NAME
            docker compose up -d
            
            # 5. Clean up old images to save disk space
            docker image prune -f
        env:
          IMAGE_NAME: ${{ needs.push-to-ecr.outputs.full_image }}
          REGISTRY: ${{ needs.push-to-ecr.outputs.registry }}
          REGION: ${{ env.AWS_REGION }}
          
stages:
  fetch_data:
    cmd: python fetch/fetch_data.py
    deps:
      - fetch/fetch_data.py
      - configs/config.yaml
    outs:
      - data/fetch/processed_eurusd.parquet
      - data/fetch/raw_eurusd.parquet
  feature_engineering:
    cmd: python features/feature_engineering.py
    deps:
      - features/feature_engineering.py
      - data/fetch/processed_eurusd.parquet
      - configs/config.yaml
    outs:
      - data/features/featured_eurusd.parquet
      - data/features/featured_columns.json
      - data/features/sequence_data.npz
  model_search:
    cmd: python training/search_model.py
    deps:
      - training/search_model.py
      - data/features/featured_eurusd.parquet
      - data/features/featured_columns.json
      - configs/config.yaml
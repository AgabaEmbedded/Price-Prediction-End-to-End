stages:
  fetch_data:
    cmd: python fetch/fetch_data.py
    deps:
      - fetch/fetch_data.py
      - configs/config.yaml
    outs:
      - data/fetch/processed_eurusd.parquet
      - data/fetch/raw_eurusd.parquet
  feature_engineering:
    cmd: python features/feature_engineering.py
    deps:
      - features/feature_engineering.py
      - data/fetch/processed_eurusd.parquet
      - configs/config.yaml
    outs:
      - data/features/featured_eurusd.parquet
      - data/features/feature_columns.json
      - data/features/sequences.npz
  model_search:
    cmd: python training/search_models.py
    deps:
      - training/search_models.py
      - data/features/featured_eurusd.parquet
      - data/features/feature_columns.json
      - configs/config.yaml
    outs:
      - search_leaderboard.csv
      
  hyperparameter_tuning:
    cmd: python training/hyperparameter_tuning.py --model RandomForest 
    deps:
      - training/hyperparameter_tuning.py
      - data/features/featured_eurusd.parquet
      - data/features/feature_columns.json
      - configs/config.yaml
    outs:
      - best_params.json
      
  final_training:
    cmd: python training/train_final.py
    deps:
      - training/train_final.py
      - data/features/featured_eurusd.parquet
      - data/features/feature_columns.json
      - best_params.json
      - configs/config.yaml
    outs:
      - saved_models
      
  prediction:
    cmd: python prediction/predict.py
    deps:
      - prediction/predict.py
      - data/features/featured_eurusd.parquet
      - data/features/feature_columns.json
      - configs/config.yaml
    
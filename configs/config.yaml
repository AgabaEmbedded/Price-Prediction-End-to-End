# configs/config.yaml
# ─────────────────────────────────────────────
# Central configuration for the EUR/USD predictor project.
# Edit this file before running any pipeline step.
# ─────────────────────────────────────────────

# ── Data ──────────────────────────────────────
data:
  ticker: "EURUSD=X"           # yfinance ticker for EUR/USD
  timeframe: "4h"              # Data granularity (e.g., 1d, 1h)
  start_date: "2010-04-01"     # Historical data start
  end_date: null               # null = today
  raw_path: "data/fetch/raw_eurusd.parquet"
  processed_path: "data/fetch/processed_eurusd.parquet"

  # Label thresholds (fraction of daily return)
  # Returns > strong_threshold  → Strong Buy  (4)
  # Returns > weak_threshold    → Buy         (3)
  # |Return| <= weak_threshold  → Hold        (2)
  # Returns < -weak_threshold   → Sell        (1)
  # Returns < -strong_threshold → Strong Sell (0)
  strong_threshold: 0.005   # 0.5%
  weak_threshold: 0.001   # 0.1%

  # Train/Val/Test split (chronological — no shuffle)
  train_ratio: 0.70
  val_ratio:   0.15
  # test_ratio is implicit: 1 - train - val = 0.15

# ── Features ──────────────────────────────────
features:
  # Rolling window sizes for technical indicators
  sma_windows: [5, 10, 20, 50, 100, 200]
  ema_windows: [5, 12, 26, 50]
  rsi_period: 14
  atr_period: 14
  bb_period: 20
  bb_std: 2
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  stoch_period: 14
  cci_period: 20
  williams_period: 14
  # Lag features (look-back steps)
  lag_periods: [1, 2, 3, 5, 10, 21]
  # Rolling statistics windows
  rolling_windows: [15, 30, 63]
  # Sequence length for LSTM/Transformer
  sequence_length: 30
  featured_path : "data/features"

# ── MLflow / S3 ───────────────────────────────
mlflow:
  location: dagshub #local, dagshub, aws
  repo_owner: "AgabaEmbedded"
  repo_name: "Price-Prediction-End-to-End"
  # Your S3 bucket for MLflow artifact storage
  # Format: s3://your-bucket-name/mlflow
  s3_artifact_uri: ""

  # If you run an MLflow tracking server on EC2, put its URL here.
  # For local tracking backed by S3, leave as "local" — artifacts
  # still go to S3 but the sqlite DB lives locally.
  tracking_uri: "https://dagshub.com/AgabaEmbedded/Price-Prediction-End-to-End.mlflow"           # or "http://your-ec2:5000"
  local_db_path: "mlflow.db"      # used when tracking_uri == "local"

  experiment_name: "Price_prediction"

# ── Model Search ──────────────────────────────
model_search:
  cv_folds: 5           # TimeSeriesSplit folds
  scoring: "f1_macro"   # Primary metric for model selection
  n_jobs: -1            # Parallelism (-1 = all cores)
  include_deep_learning: true   # Set false to skip PyTorch models

# ── Hyperparameter Tuning ─────────────────────
hpo:
  framework: "optuna"
  n_trials: 50
  timeout: 3600         # seconds (1 hour)
  cv_folds: 5
  scoring: "f1_macro"
  direction: "maximize"

# ── Training ──────────────────────────────────
training:
  random_seed: 42
  # Deep learning specific
  dl:
    batch_size: 64
    max_epochs: 100
    learning_rate: 0.001
    patience: 10          # Early stopping patience
    device: "auto"        # "auto" detects cuda/mps/cpu

# ── Output ────────────────────────────────────
output:
  model_dir: "saved_models/"
  plots_dir: "plots/"

trade:
  size: 0.01
  IC_MT5_PATH: "C:/Program Files/MetaTrader 5/terminal64.exe"
